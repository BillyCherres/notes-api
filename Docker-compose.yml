services:
  db:
    image: postgres:16
    container_name: notes-db
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .               
    container_name: notes-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/notes
      DB_USER: notes_user
      DB_PASSWORD: notes_pass

volumes:
  notes-db-data:
