services:
  db:
    image: postgres:16
    container_name: notes-db
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: notes-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/notes
      DB_USER: notes_user
      DB_PASSWORD: notes_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
  
  frontend:
    build:
      context: https://github.com/BillyCherres/notes-web.git#feature/auth0
    container_name: notes-frontend
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_AUTH0_DOMAIN: dev-battoy4bsiqoq11t.us.auth0.com
      VITE_AUTH0_CLIENT_ID: kWZkWXi5ZRhkXmPm8c9PavJizL5QmeqJ
      VITE_AUTH0_AUDIENCE: https://notes-api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  notes-db-data: